services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: items_pwd
      POSTGRES_DB: items
    ports:
      - "8888:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d items"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      CONNECTION_STRING: postgres://postgres:items_pwd@db:5432/items?sslmode=disable
      MIGRATIONS_PATH: migrations
      LOG_LEVEL: info
      HTTP_ADDR: ":8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
