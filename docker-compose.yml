services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: items_pwd
      POSTGRES_DB: items
    ports:
      - "8888:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      CONNECTION_STRING: postgres://postgres:items_pwd@db:5432/items?sslmode=disable
    depends_on:
      - db

volumes:
  pgdata: